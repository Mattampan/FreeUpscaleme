    // SISTEM ENKRIPSI WEB CRYPTO API (AES-GCM)
    // ==========================================
    const CRYPTO_SALT = new TextEncoder().encode("FreeUpscaleMe_EncryptedDB_2026_Salt");

    async function deriveEncryptionKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(passphrase),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: CRYPTO_SALT,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(text, passphrase) {
      if (!text) return "";
      try {
        const key = await deriveEncryptionKey(passphrase);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const ciphertext = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          encoded
        );
        const ivHex = Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join('');
        const cipherHex = Array.from(new Uint8Array(ciphertext)).map(b => b.toString(16).padStart(2, '0')).join('');
        return `${ivHex}:${cipherHex}`;
      } catch (err) {
        console.error("Encryption error:", err);
        return "";
      }
    }

    async function decryptData(encryptedPayload, passphrase) {
      if (!encryptedPayload || !encryptedPayload.includes(':')) return "";
      try {
        const [ivHex, cipherHex] = encryptedPayload.split(':');
        const iv = new Uint8Array(ivHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const ciphertext = new Uint8Array(cipherHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const key = await deriveEncryptionKey(passphrase);
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          ciphertext
        );
        return new TextDecoder().decode(decrypted);
      } catch (err) {
        console.warn("Decryption failed or invalid key credentials.");
        return "";
      }
    }

    async function hashPassword(password) {
      const msgBuffer = new TextEncoder().encode(password + "_upscale_salt_2026");
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

        // Cek ketersediaan config bawaan lingkungan

    function getUserDocRef(email) {
      if (!db || !window._fb) return null;
      const safeId = btoa(email.toLowerCase()).replace(/=/g, '');
      return window._fb.doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', safeId);

    async function fetchUserFromDatabase(email) {
      try {
        if (!db) {
          const local = JSON.parse(localStorage.getItem('enc_users_db') || '{}');
          return local[email.toLowerCase()] || null;
        }
        const ref = getUserDocRef(email);
        const snap = await window._fb.getDoc(ref);
        if (snap.exists()) {
          return snap.data();
        }
        return null;
      } catch (e) {
        const local = JSON.parse(localStorage.getItem('enc_users_db') || '{}');
        return local[email.toLowerCase()] || null;
      }
    }

    async function saveUserToDatabase(email, userData) {
      try {
        if (db) {
          const ref = getUserDocRef(email);
          await window._fb.setDoc(ref, userData);
        }
      } catch (e) {
        console.warn("Firestore save error, syncing locally:", e);
      }
      // Backup cadangan terenkripsi lokal
      const local = JSON.parse(localStorage.getItem('enc_users_db') || '{}');
      local[email.toLowerCase()] = userData;
